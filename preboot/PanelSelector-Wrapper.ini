# IdentifyPanel - seletor de painel ANTES do ROCKNIX
# Destino: U-Boot LEGACY RK3326 da variante A (a_uboot.bin).
# Este arquivo e compilado como boot.scr pelo workflow.
# Teclas default inspiradas no PanCho R36S; mapa R36H ainda precisa ser confirmado.
#
# R1 (c7) abre o menu. R1 + Vol- (c1) cancela e continua sem alterar nada.
# D-pad: cima=P1, direita=P2, baixo=P3, esquerda=P4.
# A=b2: overlay original R36H; B=b5: restaurar baseline; X=b7: clone; Y=b6: RG351MP-v2.
#
# A gravacao so acontece depois de carregar o candidato, criar/confirmar BASE.DTBO
# e verificar por MD5 o arquivo gravado. O DTB principal nunca e modificado.

setenv ip_candidate_addr 0x02000000
setenv ip_check_addr 0x02800000
setenv ip_saved_boot_addr 0x03000000
setenv ip_choice ""
setenv ip_profile_path ""

if gpio input c7; then
  # Tenta ativar o console grafico do U-Boot; echo continua disponivel na UART.
  if lcd init; then
    lcd clear
    lcd setbg black
    lcd setfg white
    lcd setline 0
    lcd putstr "IDENTIFYPANEL - R36H"
    lcd setline 2
    lcd putstr "Selecione a tela:"
    lcd setline 4
    lcd putstr "CIMA    - R36S Panel 1"
    lcd setline 5
    lcd putstr "DIREITA - R36S Panel 2"
    lcd setline 6
    lcd putstr "BAIXO   - R36S Panel 3"
    lcd setline 7
    lcd putstr "ESQUERDA- R36S Panel 4"
    lcd setline 9
    lcd putstr "A - DTB original R36H"
    lcd setline 10
    lcd putstr "B - Restaurar backup"
    lcd setline 11
    lcd putstr "X - R36S Clone"
    lcd setline 12
    lcd putstr "Y - RG351MP v2"
    lcd setline 14
    lcd putstr "R1 + VOL-: cancelar"
  fi

  echo
  echo "========================================="
  echo " IDENTIFYPANEL - SELECAO DE TELA R36H"
  echo "========================================="
  echo "CIMA    : R36S Panel 1"
  echo "DIREITA : R36S Panel 2"
  echo "BAIXO   : R36S Panel 3"
  echo "ESQUERDA: R36S Panel 4"
  echo "A       : DTB original importado do R36H"
  echo "B       : restaurar backup original"
  echo "X       : R36S Clone"
  echo "Y       : RG351MP v2"
  echo "R1 + VOL-: continuar sem mudar"
  echo "Aguardando uma tecla..."
  echo

  if gpio input c1; then
    setenv ip_choice "cancel"
  else
    # Espera a escolha apos exibir o menu. O boot permanece parado aqui ate
    # o utilizador pressionar uma tecla mapeada.
    while test -z "${ip_choice}"; do
      if gpio input b12; then
        setenv ip_choice "r36s-panel1"
        setenv ip_profile_path "IPANEL/PANEL1.DTBO"
      elif gpio input b15; then
        setenv ip_choice "r36s-panel2"
        setenv ip_profile_path "IPANEL/PANEL2.DTBO"
      elif gpio input b13; then
        setenv ip_choice "r36s-panel3"
        setenv ip_profile_path "IPANEL/PANEL3.DTBO"
      elif gpio input b14; then
        setenv ip_choice "r36s-panel4"
        setenv ip_profile_path "IPANEL/PANEL4.DTBO"
      elif gpio input b2; then
        setenv ip_choice "r36h-original"
        setenv ip_profile_path "IPANEL/R36H.DTBO"
      elif gpio input b5; then
        setenv ip_choice "restore-baseline"
        setenv ip_profile_path "IPANEL/BASE.DTBO"
      elif gpio input b7; then
        setenv ip_choice "r36s-clone"
        setenv ip_profile_path "IPANEL/CLONE.DTBO"
      elif gpio input b6; then
        setenv ip_choice "rg351mp-v2"
        setenv ip_profile_path "IPANEL/351MP.DTBO"
      fi
    done
  fi

  if test "${ip_choice}" = "cancel"; then
    echo "IdentifyPanel: nenhuma alteracao solicitada."
  else
    echo "IdentifyPanel: perfil escolhido: ${ip_choice}"
    # Primeiro carrega o candidato para RAM. Se o arquivo nao existir,
    # o overlay atualmente instalado permanece intacto.
    if fatload mmc 1:1 ${ip_candidate_addr} ${ip_profile_path}; then
      setenv ip_candidate_size ${filesize}
      md5sum ${ip_candidate_addr} ${ip_candidate_size} ip_expected_md5

      # Cria BASE.DTBO apenas uma vez. Prioridade: overlay atual; se ainda
      # nao existir, usa o overlay original R36H preparado no PC.
      if fatload mmc 1:1 ${ip_check_addr} IPANEL/BASE.DTBO; then
        echo "IdentifyPanel: backup de referencia ja existe."
      else
        if fatload mmc 1:1 ${ip_check_addr} overlays/mipi-panel.dtbo; then
          setenv ip_baseline_size ${filesize}
          if fatwrite mmc 1:1 ${ip_check_addr} IPANEL/BASE.DTBO ${ip_baseline_size}; then
            echo "IdentifyPanel: backup inicial criado a partir do overlay atual."
          else
            setenv ip_choice "write-error"
          fi
        else
          if fatload mmc 1:1 ${ip_check_addr} IPANEL/R36H.DTBO; then
            setenv ip_baseline_size ${filesize}
            if fatwrite mmc 1:1 ${ip_check_addr} IPANEL/BASE.DTBO ${ip_baseline_size}; then
              echo "IdentifyPanel: backup inicial criado a partir do DTB original R36H."
            else
              setenv ip_choice "write-error"
            fi
          else
            echo "ERRO: sem overlay atual e sem IPANEL/R36H.DTBO."
            setenv ip_choice "no-baseline"
          fi
        fi
      fi

      if test "${ip_choice}" != "write-error" && test "${ip_choice}" != "no-baseline"; then
        if fatwrite mmc 1:1 ${ip_candidate_addr} overlays/mipi-panel.dtbo ${ip_candidate_size}; then
          if fatload mmc 1:1 ${ip_check_addr} overlays/mipi-panel.dtbo; then
            setenv ip_readback_size ${filesize}
            md5sum ${ip_check_addr} ${ip_readback_size} ip_actual_md5
            if test "${ip_readback_size}" = "${ip_candidate_size}" && test "${ip_actual_md5}" = "${ip_expected_md5}"; then
              setenv ip_current_profile "${ip_choice}"
              saveenv
              echo "IdentifyPanel: overlay gravado e verificado."
            else
              echo "ERRO: verificacao falhou; restaurando BASE.DTBO."
              if fatload mmc 1:1 ${ip_check_addr} IPANEL/BASE.DTBO; then
                setenv ip_baseline_size ${filesize}
                fatwrite mmc 1:1 ${ip_check_addr} overlays/mipi-panel.dtbo ${ip_baseline_size}
              fi
            fi
          else
            echo "ERRO: nao foi possivel ler o overlay gravado."
          fi
        else
          echo "ERRO: fatwrite falhou; tentando restaurar BASE.DTBO."
          if fatload mmc 1:1 ${ip_check_addr} IPANEL/BASE.DTBO; then
            setenv ip_baseline_size ${filesize}
            fatwrite mmc 1:1 ${ip_check_addr} overlays/mipi-panel.dtbo ${ip_baseline_size}
          fi
        fi
      fi
    else
      echo "ERRO: perfil nao encontrado: ${ip_profile_path}"
      echo "Nenhum arquivo ativo foi alterado."
    fi
  fi
fi

# Continua o fluxo de boot ORIGINAL do ROCKNIX. O instalador salva o boot.scr
# anterior como boot0.scr; se ele nao existir, nao tenta iniciar o kernel.
if fatload mmc 1:1 ${ip_saved_boot_addr} boot0.scr; then
  source ${ip_saved_boot_addr}
else
  echo "FATAL: boot0.scr ausente. Restaure o boot.scr original pelo PC."
fi
