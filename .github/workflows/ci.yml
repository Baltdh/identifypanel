name: IdentifyPanel checks
on:
  push:
    branches: [main, autopanel-core]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python and validate Shell syntax
        run: |
          python -m py_compile identifypanel.py tools/fetch_official_profiles.py tools/select_profile.py
          sh -n Selecionar-Tela.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python identifypanel.py --help
          python identifypanel.py profiles --profiles ./profiles
